# Site settings
title: trasteando
description: "Proyectos, código y cacharreo con electrónica, automatización e IA."
lang: es
baseurl: ""
url: "https://blog.trasteando.org"
logo: "/assets/img/logo.png"
favicon: "/favicon.ico"
author: Javier Moreno

# Navbar links
navbar-links:
  Inicio: "/"
  Blog: "/blog/"
  Sobre mí: "/aboutme"

# Social network links (optional)
social-network-links:
  github: JaviMore
  linkedin: jmorenogonzalez

# Excerpt settings
excerpt_length: 50

# Syntax highlighting
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Pagination
paginate: 6
paginate_path: "/blog/page:num/"

# Permalinks
permalink: /:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Build settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
