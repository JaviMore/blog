<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__tagline">{{ site.description }}</p>

    <div class="site-footer__socials">
      {% if site.social-network-links.github %}
      <a href="https://github.com/{{ site.social-network-links.github }}" class="social-link" aria-label="GitHub" target="_blank" rel="me noopener">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.5 0-.24-.01-1.04-.01-1.88-2.78.62-3.37-1.22-3.37-1.22-.46-1.19-1.11-1.51-1.11-1.51-.91-.64.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.72 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .28.18.61.69.5A10.26 10.26 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"/></svg>
      </a>
      {% endif %}
      {% if site.social-network-links.linkedin %}
      <a href="https://www.linkedin.com/in/{{ site.social-network-links.linkedin }}" class="social-link" aria-label="LinkedIn" target="_blank" rel="me noopener">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6.94 8.5H3.56V20.4h3.38V8.5ZM5.25 3.1a1.96 1.96 0 1 0 0 3.92 1.96 1.96 0 0 0 0-3.92ZM20.44 20.4h-3.37v-6.24c0-1.49-.03-3.4-2.07-3.4-2.08 0-2.4 1.62-2.4 3.3v6.34H9.24V8.5h3.24v1.63h.05c.45-.86 1.56-1.76 3.2-1.76 3.43 0 4.06 2.25 4.06 5.19v6.84Z"/></svg>
      </a>
      {% endif %}
      <a href="{{ '/feed.xml' | relative_url }}" class="social-link" aria-label="RSS">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 4a16 16 0 0 1 16 16h-3a13 13 0 0 0-13-13V4Zm0 6.5A9.5 9.5 0 0 1 13.5 20h-3A6.5 6.5 0 0 0 4 13.5v-3ZM6.5 16A2.5 2.5 0 1 1 6.5 21a2.5 2.5 0 0 1 0-5Z"/></svg>
      </a>
    </div>

    <p class="site-footer__legal">© {{ site.time | date: '%Y' }} {{ site.author }}. Hecho con Jekyll.</p>
  </div>
</footer>
