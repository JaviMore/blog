---
layout: default
---
<header class="page-header">
  <div class="container">
    <p class="page-header__eyebrow reveal" translate="no">{{ site.title }}</p>
    <h1 class="page-header__title reveal">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="page-header__subtitle reveal">{{ page.subtitle }}</p>
    {% endif %}
  </div>
</header>

<article class="container prose-wrap">
  <div class="prose reveal">
    {{ content }}
  </div>
</article>
